name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign nothing; just validate the release config end to end"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub release and upload its assets.
      contents: write
      # Mint the short-lived OIDC token cosign exchanges for a signing
      # certificate. Without this, keyless signing cannot work.
      id-token: write
      # Push the registry-only katra-mcp image to GHCR.
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # goreleaser needs full history and tags for the changelog and for
          # `git describe`-style version resolution.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # The registry image is a two-platform manifest. Its Alpine arm64 layer
      # executes apk on this amd64 runner, so QEMU and a buildx builder are
      # required even though the Go binary itself is cross-compiled.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A missing tap token must be loud, not silent. The release still ships
      # binaries without it; only the Homebrew cask update is skipped.
      - name: Check Homebrew tap token
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -n "$HOMEBREW_TAP_GITHUB_TOKEN" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN is set; the tap will be updated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Homebrew tap not updated"
            echo
            echo "The \`HOMEBREW_TAP_GITHUB_TOKEN\` secret is not set on this repository,"
            echo "so \`craigjmidwinter/homebrew-tap\` was **not** updated for this release."
            echo "Binaries, checksums and signatures were still published."
            echo
            echo "To fix: create a token that can write to \`craigjmidwinter/homebrew-tap\`"
            echo "(fine-grained PAT, repository access limited to \`homebrew-tap\`,"
            echo "\`Contents: Read and write\`) and add it as the repository secret"
            echo "\`HOMEBREW_TAP_GITHUB_TOKEN\`. The default \`GITHUB_TOKEN\` cannot"
            echo "push to another repository."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Homebrew tap skipped::HOMEBREW_TAP_GITHUB_TOKEN is not set; craigjmidwinter/homebrew-tap was not updated."

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run)
                && 'release --snapshot --clean --skip=publish,sign'
                || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately referenced even when unset: GitHub expands a missing
          # secret to the empty string, which .goreleaser.yml treats as
          # "skip the tap" rather than blowing up on an undefined variable.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/mcpb/*.mcpb
            dist/checksums.txt
          retention-days: 7
          if-no-files-found: error

  # The image exists only to give the official MCP Registry an installable
  # package for the existing stdio server. Publish metadata after the release
  # job has pushed that exact image tag; a dry run never reaches this job.
  mcp-registry:
    name: mcp registry
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # mcp-publisher exchanges the workflow identity for a short-lived token.
      # There is no stored MCP Registry token or interactive device-code step.
      id-token: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: ./scripts/install-mcp-publisher.sh

      # server.json is a checked, readable template. The release tag is the
      # source of truth, so stamp both fields that encode a version immediately
      # before publishing rather than relying on a manual pre-tag bump.
      - name: Stamp the tag into server.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" \
             --arg image "ghcr.io/${{ github.repository_owner }}/katra-mcp:" \
            '.version = $v | .packages[0].identifier = $image + $v' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish

  # The documentation site is plain GitHub Pages from /docs on the default
  # branch, so there is no build job for it here. This only pins the docs to
  # the released version by leaving a note in the run summary -- the site is
  # continuously deployed and intentionally tracks main, not the tag.
  docs-note:
    name: docs
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Note the docs are continuous
        run: |
          {
            echo "### Documentation"
            echo
            echo "<https://craigjmidwinter.github.io/katra/> is served from \`/docs\`"
            echo "on \`main\` and tracks the branch, not \`${GITHUB_REF_NAME}\`."
            echo "If this release changed a command, a config key, or a component,"
            echo "the site already reflects it."
          } >> "$GITHUB_STEP_SUMMARY"
