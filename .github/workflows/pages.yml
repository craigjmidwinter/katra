# The documentation site, plus katra's own chronicle rendered into it.
#
# This replaces the plain "Pages from main//docs" build. It has to: the
# chronicle at /devlog is generated by `katra build` from katra/, and the
# branch-based build can only serve files that are committed. Generated output
# is not committed here -- docs/devlog/ is gitignored -- so the site is
# assembled in CI and deployed as an artifact instead.
#
# The point is dogfooding that a reader can check. katra makes build logs; a
# katra whose own build log is invisible is the weakest possible pitch for
# itself, and the colophon on generated deploys now sends readers somewhere
# that should have one.
#
# NOTE: this only takes effect once the repository's Pages source is switched
# from "Deploy from a branch" to "GitHub Actions". Until then the build job
# still runs and proves the site assembles; the deploy job is what needs the
# setting.
name: Pages

on:
  push:
    branches: [main]
  # Runs on PRs too, without deploying, so a change that breaks the site fails
  # in review rather than after merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a deploy in flight: a half-published site is worse than a
  # slightly stale one.
  cancel-in-progress: false

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Build katra
        run: make build

      # Renders katra/ into docs/devlog/ so Jekyll picks it up as static files.
      # The viewer assets carry no front matter, so Jekyll copies them verbatim
      # rather than trying to run them through Liquid.
      - name: Render the chronicle
        run: |
          set -euo pipefail
          ./bin/katra build --out docs/devlog
          test -s docs/devlog/data.json
          test -s docs/devlog/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # The chronicle has to survive the Jekyll pass. Asserting it rather than
      # assuming it, because a silently dropped directory looks exactly like a
      # successful build.
      - name: The chronicle survived the Jekyll build
        run: |
          set -euo pipefail
          test -s _site/devlog/index.html
          test -s _site/devlog/data.json
          entries=$(python3 -c "import json;print(len(json.load(open('_site/devlog/data.json'))['entries']))")
          echo "chronicle published with $entries entries" >> "$GITHUB_STEP_SUMMARY"
          test "$entries" -gt 0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
