version: 2

project_name: katra

# Where scripts/build-mcpb.sh drops the MCP Bundles. Named once here because
# three places refer to it: the build hook that writes them, the checksum
# block that signs them, and the release block that uploads them.
env:
  - MCPB_OUT=dist/mcpb

before:
  hooks:
    - go mod download

# Two binaries ship together and are versioned together. katra-mcp is not
# optional tooling: the skill and every MCP client wiring assume it is beside
# katra on PATH, so an archive carrying only one of them is a broken install.
builds:
  - id: katra
    main: ./cmd/katra
    binary: katra
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Match what `make build` stamps: a leading-v version string, so
    # `katra --version` reports the tag exactly.
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

  - id: katra-mcp
    main: ./cmd/katra-mcp
    binary: katra-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    # The .mcpb bundle is assembled here, per target, rather than in an `after`
    # hook, because goreleaser writes checksums.txt before `after` hooks run --
    # and an asset the checksum file does not cover is one the release footer's
    # verify instructions silently do not apply to. See
    # docs/design/mcpb-bundle.md.
    hooks:
      post:
        - cmd: ./scripts/build-mcpb.sh "{{ .Path }}" "{{ .Os }}" "{{ .Arch }}" "{{ .Version }}" "{{ .Env.MCPB_OUT }}"

archives:
  - id: katra
    ids:
      - katra
      - katra-mcp
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE
      - src: examples/*
        dst: examples
      # The launchd agent for the hub daemon. Shipping it in the archive means a
      # binary download can set the hub up without cloning.
      - src: contrib/**/*
        dst: contrib

checksum:
  name_template: checksums.txt
  algorithm: sha256
  # Pull the .mcpb bundles into the same signed checksum file as the archives,
  # so one `sha256sum --check` covers every asset a download page offers.
  extra_files:
    - glob: dist/mcpb/*.mcpb

# The official MCP Registry indexes installable packages, not bare Go release
# binaries. This image is deliberately narrower than katra's release archives:
# it contains only katra-mcp and the git executable its tools invoke. It is a
# registry transport wrapper, not a general-purpose container install; native
# binaries remain the supported way to use katra on a working tree.
dockers_v2:
  - id: katra-mcp-registry
    ids:
      - katra-mcp
    images:
      - ghcr.io/craigjmidwinter/katra-mcp
    dockerfile: Dockerfile.registry
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: "katra-mcp"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "https://github.com/craigjmidwinter/katra"
      org.opencontainers.image.licenses: MIT
    # Ownership is checked on the manifest, not only the platform configs.
    # This string, Dockerfile.registry's LABEL, and server.json's name move
    # together or registry publication is rejected.
    annotations:
      io.modelcontextprotocol.server.name: "io.github.craigjmidwinter/katra"
      org.opencontainers.image.source: "https://github.com/craigjmidwinter/katra"
      org.opencontainers.image.description: "Katra's stdio MCP server, packaged only for official registry distribution."

# Keyless signing with cosign + GitHub OIDC. No long-lived key to manage: the
# signature is bound to this workflow's identity and logged in Rekor.
signs:
  - id: cosign-checksums
    cmd: cosign
    signature: ${artifact}.sig
    certificate: ${artifact}.pem
    args:
      - sign-blob
      - --output-signature=${signature}
      - --output-certificate=${certificate}
      - ${artifact}
      - --yes
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      # katra logs its own development in katra/, and those commits are
      # bookkeeping rather than changes to the tool.
      - "^katra:"
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: katra
    ids:
      - katra
    binaries:
      - katra
      - katra-mcp
    repository:
      owner: craigjmidwinter
      name: homebrew-tap
      branch: main
      # Cross-repo push: the default GITHUB_TOKEN cannot write to another
      # repository, so this needs a PAT in the HOMEBREW_TAP_GITHUB_TOKEN
      # secret. When that secret is absent the env var is empty and skip_upload
      # below turns the tap update into a no-op rather than a hard failure --
      # the release still ships binaries.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    skip_upload: '{{ if .Env.HOMEBREW_TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}'
    directory: Casks
    homepage: https://github.com/craigjmidwinter/katra
    description: A committed, rich-component dev log you write as you build -- stamped with the commit it describes, served as a live page.
    license: MIT
    commit_author:
      name: goreleaser[bot]
      email: 1444982+goreleaser[bot]@users.noreply.github.com
    commit_msg_template: "katra {{ .Tag }}"
    # The release binaries are not Apple-notarized, so Gatekeeper quarantines
    # them on download. Strip the attribute the way Homebrew itself recommends
    # for unsigned binaries.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/katra"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/katra-mcp"]
          end

release:
  github:
    owner: craigjmidwinter
    name: katra
  prerelease: auto
  # MCP Bundles for clients that install a package rather than pull an image.
  # The OCI package in server.json serves the official registry; this serves
  # everywhere that does not ingest it.
  extra_files:
    - glob: dist/mcpb/*.mcpb
  footer: |
    ## Install

    ```sh
    brew install craigjmidwinter/tap/katra
    ```

    Or download an archive below and verify it:

    ```sh
    # 1. checksum -- on macOS use `shasum -a 256` instead of `sha256sum`
    sha256sum --check --ignore-missing checksums.txt

    # 2. signature over the checksum file (keyless, no key to fetch)
    cosign verify-blob \
      --certificate checksums.txt.pem \
      --signature checksums.txt.sig \
      --certificate-identity-regexp '^https://github\.com/craigjmidwinter/katra/\.github/workflows/release\.yml@refs/tags/' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    ```
